name: Keep Streamlit app awake

on:
  schedule:
    # 3시간마다 실행 (UTC 기준 매 3시간 17분)
    - cron: "17 */3 * * *"
  workflow_dispatch:   # Actions 탭에서 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit app (wake if asleep)
        run: python .github/scripts/keep_awake.py

      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-failure
          path: keep_awake_failure.png
          if-no-files-found: ignore
